title: Shader Programming
author: Steve Trettel
blurb: "Notes and courses on GPU shader programming for mathematical
  illustration — rendering fractals, implicit surfaces, tilings, and
  simulations, with every example live and editable in the page."
pdf: false

# The cover's one picture, in book/shaders/.
shader: hero

# A line under the cover's opening, in markdown. Links are the point of it.
note: "New to this? The [quickstart](/quickstart/) gets you set up to write
  your own in a few minutes."

# Standalone pages: built and addressable, but outside the reading order —
# no number, no place in the contents, no previous/next. Reached from a link
# rather than from the nav.
pages:
  - { file: quickstart.md, slug: quickstart }

# Each course numbers its own chapters from 1 — a reader in the CIRM notes
# should meet chapters 1, 2, 3, not 14, 15, 16.
numbering: per-part

# Slugs are explicit throughout, for two reasons. The book cannot be held by
# basenames — five CIRM days each have a notes.md and a homework.md — and the
# addresses under /cirm-2026/ were handed to workshop participants, so they
# are kept as real page paths rather than redirected away. They mirror the
# Quarto-era paths exactly; the build emits a redirect from each old
# `<path>.html` to its `<path>/`.

parts:
  - title: Learning Shaders
    subtitle: Graduate Mini Course, CIRM 2026
    chapters:
      - { file: cirm/index.md, slug: cirm-2026, label: Introduction }

      - { file: cirm/lectures/day1/notes.md, slug: cirm-2026/lectures/day1/notes, label: Pixels }
      - { file: cirm/lectures/day1/homework.md, slug: cirm-2026/lectures/day1/homework, label: Homework, sub: true }
      - { file: cirm/lectures/day2/notes.md, slug: cirm-2026/lectures/day2/notes, label: Fractals }
      - { file: cirm/lectures/day2/homework.md, slug: cirm-2026/lectures/day2/homework, label: Homework, sub: true }
      - { file: cirm/lectures/day3/notes.md, slug: cirm-2026/lectures/day3/notes, label: Tilings }
      - { file: cirm/lectures/day3/homework.md, slug: cirm-2026/lectures/day3/homework, label: Homework, sub: true }
      - { file: cirm/lectures/day4/notes.md, slug: cirm-2026/lectures/day4/notes, label: Simulations }
      - { file: cirm/lectures/day4/homework.md, slug: cirm-2026/lectures/day4/homework, label: Homework, sub: true }
      - { file: cirm/lectures/day5/notes.md, slug: cirm-2026/lectures/day5/notes, label: Rendering }
      - { file: cirm/lectures/day5/homework.md, slug: cirm-2026/lectures/day5/homework, label: Homework, sub: true }

      - group: Appendices
        chapters:
          - { file: cirm/appendices/glsl.md, slug: cirm-2026/appendices/glsl }
          - { file: cirm/appendices/coordinates.md, slug: cirm-2026/appendices/coordinates }
          - { file: cirm/appendices/color.md, slug: cirm-2026/appendices/color }

  - title: Useful Shaders for Research
    subtitle: Conference Workshop, IHP 2026
    chapters:
      - { file: ihp/index.md, slug: ihp-2026, label: Introduction }
      - { file: ihp/glsl-intro/index.md, slug: ihp-2026/glsl-intro }
      - { file: ihp/functions/index.md, slug: ihp-2026/functions }
      - { file: ihp/geometry/index.md, slug: ihp-2026/geometry }
      - { file: ihp/dynamics/index.md, slug: ihp-2026/dynamics }

  - title: 3D Rendering
    subtitle: IHP Lecture Series 2026
    chapters:
      - { file: 3d/01-first-rays/notes.md,   slug: notes/3d/01-first-rays/notes }
      - { file: 3d/02-raymarching/notes.md,  slug: notes/3d/02-raymarching/notes }
      - { file: 3d/03-deriving-sdfs/notes.md, slug: notes/3d/03-deriving-sdfs/notes }
      - { file: 3d/04-sculpting/notes.md,    slug: notes/3d/04-sculpting/notes }
      - { file: 3d/05-lighting/notes.md,     slug: notes/3d/05-lighting/notes }
      - { file: 3d/06-materials/notes.md,    slug: notes/3d/06-materials/notes }
